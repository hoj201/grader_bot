[tool.poetry]
name = "graderbot"
version = "0.1.0"
description = ""
authors = ["hoj201 <hoj201@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
numpy = "^2.5.1"
pymupdf = "^1.28.0"
pillow = "^12.3.0"
requests = "^2.34.2"
python-dotenv = "^1.2.2"
pytesseract = "^0.3.13"
anthropic = "^0.117.0"
opencv-python-headless = "^5.0.0.93"
boto3 = "^1.35.0"
streamlit = "^1.38.0"
qrcode = "^8.0"
scikit-learn = "^1.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
moto = {extras = ["s3"], version = "^5.0.0"}

[tool.pytest.ini_options]
# The app modules live in the top-level `graderbot` package; add the repo root
# to sys.path so `import graderbot` resolves without an install step.
pythonpath = ["."]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
