[tool.poetry]
name = "graderbot"
version = "0.1.0"
description = ""
authors = ["hoj201 <hoj201@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
numpy = "^2.5.1"
pymupdf = "^1.28.0"
pillow = "^12.3.0"
requests = "^2.34.2"
python-dotenv = "^1.2.2"
pytesseract = "^0.3.13"
anthropic = "^0.117.0"
opencv-python-headless = "^5.0.0.93"
boto3 = "^1.35.0"
streamlit = "^1.38.0"
qrcode = "^8.0"
scikit-learn = "^1.5.0"
plotly = "^6.9.0"
onnxruntime = "~1.23.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-xdist = "^3.6.0"
moto = {extras = ["s3"], version = "^5.0.0"}
modal = "^1.5.4"

[tool.pytest.ini_options]
# The app modules live in the top-level `graderbot` package; add the repo root
# to sys.path so `import graderbot` resolves without an install step.
pythonpath = ["."]
# Restrict collection to tests/ so `poetry run pytest` never tries to import
# easyocr_service/test_main.py -- that service's dependencies (fastapi,
# easyocr/torch) are intentionally not in this project's venv (see
# graderbot/answer_reader.py); its tests run inside its own container.
testpaths = ["tests"]
# -n auto (pytest-xdist) spreads the suite across all idle cores instead of
# running ~100s of CPU almost serially (issue #78). Tests that compile the
# same LaTeX file into a shared output directory are safe under this because
# `latexmk_worksheet` (worksheet_synth.py) serializes same-outdir compiles
# with an advisory file lock.
addopts = "-n auto"
markers = [
    "slow: real latexmk compiles or Streamlit AppTest runs -- deselect with '-m \"not slow\"' for a fast local loop (issue #78)",
]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
