# Fly.io app config for GraderBot's Streamlit frontend (app.py).
# Deploy with: fly launch --no-deploy (first time, to create the app) then
# fly deploy. See README.md "Web frontend" section for required secrets.

app = "graderbot"
primary_region = "iad"

[build]

[env]
  WORKSHEETS_DB_PATH = "/data/worksheets.sqlite3"

[mounts]
  source = "graderbot_data"
  destination = "/data"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
