[tool.poetry]
name = "vectorizer-service"
version = "0.1.0"
description = "DINOv2 embedding service for handwritten student names (issue #46), deployed separately from graderbot on Modal."
authors = ["hoj201 <hoj201@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.11"
torch = "^2.4.0"
transformers = "^4.44.0"
pillow = "^11.0.0"
numpy = "^2.1.0"
opencv-python-headless = "^4.10.0"
modal = "^0.68.0"
fastapi = "^0.115.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.27.0"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
